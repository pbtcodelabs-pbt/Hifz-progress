<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>بچے کی کارکردگی رپورٹ</title>
<!-- MD2511WE091 (مالک کا حکم — ONLINE-PLAN §3): والدین کا صفحہ — لنک #<20 حروف> + 4 ہندسوں کا پن؛ صرف اسی ایک بچے کی تیار رپورٹ (سرور /mdpar)؛
     ہر حصہ دبانے پر اس کی پوری تفصیل کھلتی ہے؛ «اس فون پر یاد رکھیں» (صرف اسی لنک کا پن، اسی براؤزر میں)۔ کوئی سروس ورکر / کیش نہیں۔ -->
<style>
@font-face{font-family:N;src:url(fonts/Jameel_Noori_Nastaleeq.woff)}
@font-face{font-family:K;src:url(fonts/Jameel_Noori_Nastaleeq_Kasheeda.ttf)}
:root{--g:#0f766e;--gd:#065f46;--bg:#eef2f1;--tx:#1e293b;--mu:#64748b;--ln:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:N,'Noto Nastaliq Urdu',serif;font-size:16px}
.n{font-family:Arial,sans-serif;font-weight:700;unicode-bidi:isolate;direction:ltr;display:inline-block}
.wrap{max-width:460px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.mad{font-size:14px;color:var(--g);text-align:center;padding:5px;background:#e6f2ee}
.hd{background:#f3f7f5;padding:14px;display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--g)}
.ph{width:78px;height:78px;border-radius:50%;flex:none;background:#cbd5e1 center/cover;border:3px solid #fff;box-shadow:0 0 0 2px var(--g);display:flex;align-items:center;justify-content:center;font-size:34px}
.nm{font-family:K,N,serif;font-size:26px;color:var(--gd);line-height:1.5}
.mt{font-size:14px;line-height:1.85;color:#475569}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px}
.st div{background:#f8fafc;border:1px solid var(--ln);border-radius:12px;text-align:center;padding:4px 2px;font-size:13px}
.st b{display:block;font:800 18px Arial,sans-serif;color:var(--g)}
.rk{padding:0 12px 10px}.rk .t{font-size:13px;color:var(--mu);margin-bottom:2px}
.rk3{display:flex;gap:6px}.rk3 span{flex:1;border-radius:10px;padding:2px 4px;text-align:center;font-size:13px;line-height:1.6;background:#f1f5f9}
.rk3 span b{display:block;font:800 15px Arial,sans-serif}
.rk3 .w{background:#fef2f2;color:#991b1b}.rk3 .gd{background:#ecfdf5;color:var(--gd)}
details{border-top:1px solid var(--ln)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:16px}
summary::-webkit-details-marker{display:none}
summary em{font-style:normal;font:700 13px Arial,sans-serif;color:var(--g)}
summary i{margin-right:auto;font-style:normal;color:#94a3b8;font-size:13px;transition:transform .2s}
details[open] summary i{transform:rotate(180deg)}
.in{padding:2px 14px 12px;font-size:14.5px;line-height:1.95;color:#334155}
.day{border:1px solid var(--ln);border-radius:12px;padding:5px 8px;margin:6px 0}
.day h5{margin:0;font-size:14px;color:var(--gd);display:flex;gap:6px;align-items:center}
.six{display:inline-flex;gap:2px;margin-right:auto}
.six u{text-decoration:none;width:18px;height:18px;border-radius:5px;font:700 11px/18px Arial;text-align:center;background:#f1f5f9;color:#94a3b8}
.six .p{background:#dcfce7;color:#166534}.six .h{background:#fef3c7;color:#92400e}.six .a{background:#fee2e2;color:#991b1b}
.e{font-size:14px;line-height:1.8}.e b{font-weight:400}
.k1{color:#16a34a}.k2{color:#2563eb}.k3{color:#9333ea}
.ft{text-align:center;font-size:12px;color:#94a3b8;padding:8px}
.box{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center;margin-top:40px}
.box h2{font-family:K,N,serif;color:var(--gd);font-weight:400;margin:0 0 6px}
.box input{width:160px;font:800 28px Arial;letter-spacing:10px;text-align:center;border:2px solid #94a3b8;border-radius:12px;padding:6px;direction:ltr}
.box button{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;background:var(--gd);color:#fff;font:inherit;font-size:18px;padding:9px}
.box label{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px;font-size:14px;color:var(--mu)}
.err{color:#b91c1c;font-size:14px;min-height:22px;margin-top:6px}
.sh{display:flex;gap:6px;padding:8px 12px}.sh button{flex:1;border:0;border-radius:10px;padding:5px;font:inherit;font-size:14px;background:#f1f5f9;color:#334155}
@media print{body{background:#fff}.sh,.ft{display:none}details{display:block}details>*{display:block}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="box">⏳ …</div></div>
<script>
(function(){
  'use strict';
  var W = 'https://aio-pos-verify.pbtcodelabs.workers.dev/mdpar', tok = (location.hash || '').replace(/^#/, '').replace(/[^A-Za-z0-9]/g, ''), K = 'mdpar_' + tok, app = document.getElementById('app');
  var MN = ['جنوری', 'فروری', 'مارچ', 'اپریل', 'مئی', 'جون', 'جولائی', 'اگست', 'ستمبر', 'اکتوبر', 'نومبر', 'دسمبر'], DY = ['اتوار', 'پیر', 'منگل', 'بدھ', 'جمعرات', 'جمعہ', 'ہفتہ'];
  var SES = ['فجر سے پہلے', 'فجر کے بعد', 'ناشتے کے بعد', 'ظہر کے بعد', 'مغرب کے بعد', 'عشاء کے بعد'], KN = { sabaq: ['سبق', 'k1'], sabqi: ['سبقی', 'k2'], manzil: ['منزل', 'k3'] };
  function E(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function N(x){ return '<span class="n">' + E(x) + '</span>'; }
  function dt(ds){ var d = new Date(ds + 'T12:00:00'); return DY[d.getDay()] + '، ' + N(d.getDate()) + ' ' + MN[d.getMonth()]; }
  function ymN(ym){ var p = String(ym || '').split('-'); return p.length === 2 ? MN[+p[1] - 1] + ' ' + N(p[0]) : ''; }
  if(!/^[A-Za-z0-9]{20}$/.test(tok)){ app.innerHTML = '<div class="box"><h2>لنک درست نہیں</h2>مدرسے سے بھیجا ہوا پورا لنک کھولیں۔</div>'; return; }
  function ask(msg){
    app.innerHTML = '<div class="box"><h2>📊 بچے کی کارکردگی رپورٹ</h2><div style="font-size:15px;color:#475569">مدرسے کی طرف سے ملا 4 ہندسوں کا پن لکھیں</div><div style="margin-top:12px"><input id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code"></div><label><input type="checkbox" id="rem" checked style="width:auto;letter-spacing:0;font-size:14px"> اس فون پر یاد رکھیں</label><div class="err" id="err">' + (msg || '') + '</div><button id="go">رپورٹ دیکھیں</button></div>';
    var i = document.getElementById('pin'); i.focus(); i.addEventListener('input', function(){ i.value = i.value.replace(/[۰-۹]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }).replace(/\D/g, '').slice(0, 4); if(i.value.length === 4) go(); });
    document.getElementById('go').onclick = go;
    function go(){ var p = i.value; if(p.length !== 4){ document.getElementById('err').textContent = 'پورے 4 ہندسے لکھیں'; return; } load(p, document.getElementById('rem').checked); }
  }
  function load(pin, rem){
    app.innerHTML = '<div class="box">⏳ رپورٹ آ رہی ہے…</div>';
    fetch(W, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op: 'get', tok: tok, pin: pin }) }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok){ if(rem) try{ localStorage.setItem(K, pin); }catch(e){} var d = null; try{ d = JSON.parse(j.data); }catch(e){} if(!d){ ask('رپورٹ پڑھی نہیں جا سکی'); return; } draw(d, j.ts); return; }
      try{ localStorage.removeItem(K); }catch(e){}
      ask(j && j.reason === 'pin' ? '❌ پن غلط ہے' + (j.left != null ? ' — ' + N(j.left) + ' کوشش باقی' : '') : j && j.reason === 'lock' ? '⏳ زیادہ غلط پن — ' + N(j.wait) + ' منٹ بعد دوبارہ' : j && j.reason === 'gone' ? 'یہ لنک بند ہو چکا ہے — مدرسے سے نیا لنک لیں' : 'کچھ مسئلہ — دوبارہ کوشش کریں');
    }).catch(function(){ ask('📶 انٹرنیٹ چیک کریں'); });
  }
  function draw(d, ts){
    var s = d.s || {}, A = d.at || {}, m = A.m || {}, pm = A.pm || {}, rk = (d.rk && d.rk.l) || [], h = d.h || {}, kh = d.kh;
    var avg = rk.length ? Math.round(rk.reduce(function(t, x){ return t + x.p; }, 0) / rk.length) : null, by = {}; rk.forEach(function(x){ by[x.k] = x; });
    var H = '<div class="card"><div class="mad">' + E(d.mad || '') + '</div>'
      + '<div class="hd"><div class="ph"' + (s.ph ? ' style="background-image:url(' + E(s.ph) + ')"' : '') + '>' + (s.ph ? '' : '👤') + '</div><div><div class="nm">' + E(s.n) + '</div><div class="mt">' + (s.w ? 'ولد ' + E(s.w) + ' · ' : '') + (s.roll ? 'رول ' + N(s.roll) + ' · ' : '') + E(s.cls || '') + (s.ust ? '<br>استاد: ' + E(s.ust) : '') + '</div></div></div>'
      + '<div class="st"><div><b>' + (m.pct != null ? m.pct + '%' : '—') + '</b>حاضری</div>' + ['سبق', 'سبقی', 'منزل'].map(function(k){ return '<div><b>' + (by[k] ? by[k].p : '—') + '</b>' + k + '</div>'; }).join('') + '</div>';
    if(rk.length) H += '<div class="rk"><div class="t">📈 کون اوپر، کون نیچے (پچھلے ' + N(d.rk.d) + ' دن)</div><div class="rk3">' + rk.map(function(x, i){ return '<span class="' + (i === 0 ? 'gd' : i === rk.length - 1 && rk.length > 1 ? 'w' : '') + '">' + '①②③'[i] + ' ' + x.k + '<b>' + x.p + '%' + (x.tr >= 5 ? ' ↑' : x.tr <= -5 ? ' ↓' : '') + '</b></span>'; }).join('') + '</div></div>';
    var w = rk.length > 1 ? rk[rk.length - 1] : null;
    H += '<details><summary>📊 <b>کارکردگی</b>' + (avg != null ? '<em>اوسط ' + avg + '/100</em>' : '') + '<i>▾</i></summary><div class="in">'
      + (rk.length ? rk.map(function(x){ return '• ' + x.k + ': ' + N(x.p + '%') + (x.m ? ' · روزانہ غلطی ' + N(x.m) : '') + (x.a ? ' · اٹکن ' + N(x.a) : ''); }).join('<br>') : 'ابھی کم ریکارڈ')
      + (w && (w.p < 85 || rk[0].p - w.p >= 10) ? '<br>⚠️ <b>' + w.k + '</b> نسبتاً کمزور — گھر پر بھی ' + w.k + ' سنیں۔' : rk.length ? '<br>✅ ماشاء اللہ، تینوں اچھے جا رہے ہیں۔' : '') + '</div></details>';
    H += '<details><summary>🕌 <b>حاضری</b>' + (m.pct != null ? '<em>' + m.pct + '%</em>' : '') + '<i>▾</i></summary><div class="in">'
      + ymN(A.ym) + ': ' + (m.n ? 'حاضر ' + N(m.p) + ' · آدھی ' + N(m.h) + ' · غیر حاضر ' + N(m.a) + ' نشستیں' : 'ابھی درج نہیں')
      + '<br>' + ymN(A.pym) + ': ' + (pm.n ? N(pm.pct + '%') + ' (حاضر ' + N(pm.p) + ' · غیر حاضر ' + N(pm.a) + ')' : '—')
      + (function(){ var ab = (d.days || []).filter(function(x){ var r = x.a.filter(function(v){ return v && v !== 'c'; }); return r.length && r.every(function(v){ return v === 'a'; }); }); return ab.length ? '<br>❌ پورے دن غیر حاضر: ' + ab.map(function(x){ return dt(x.d) + (x.w ? ' (' + E(x.w) + ')' : ''); }).join('، ') : ''; })() + '</div></details>';
    H += '<details><summary>📖 <b>حفظ کی ترقی</b>' + (h.pct != null ? '<em>' + h.pct + '%</em>' : '') + '<i>▾</i></summary><div class="in">' + (h.pct != null ? 'قرآن مجید کا ' + N(h.pct + '%') + ' یاد' + (h.full ? ' · مکمل پارے ' + N(h.full) : '') + (h.part ? ' · جزوی ' + N(h.part) : '') : '—') + '</div></details>';
    if(kh) H += '<details><summary>🏁 <b>ختم قرآن</b><em>' + (kh.done ? 'مکمل' : (function(){ var x = new Date(kh.d + 'T12:00:00'); return MN[x.getMonth()] + ' ' + x.getFullYear(); })()) + '</em><i>▾</i></summary><div class="in">' + (kh.done ? 'الحمدللہ حفظ مکمل' : 'موجودہ رفتار سے متوقع تاریخ: ' + dt(kh.d) + ' ' + N(kh.d.slice(0, 4)) + (kh.tr === 'up' ? ' — رفتار بڑھ رہی ہے ↑' : kh.tr === 'dn' ? ' — رفتار کم ہو رہی ہے ↓' : '')) + '</div></details>';
    H += '<details open><summary>📝 <b>روزانہ ریکارڈ</b><em>پچھلے 30 دن</em><i>▾</i></summary><div class="in">' + ((d.days || []).map(function(x){
      var six = '<span class="six">' + x.a.map(function(v, i){ return v === 'c' ? '' : '<u class="' + (v || '') + '" title="' + SES[i] + '">' + (v === 'p' ? 'ح' : v === 'h' ? '½' : v === 'a' ? 'غ' : '·') + '</u>'; }).join('') + '</span>';
      return '<div class="day"><h5>' + dt(x.d) + six + '</h5>' + (x.e.length ? x.e.map(function(e){ var k = KN[e.k] || [e.k, '']; return '<div class="e"><b class="' + k[1] + '">' + k[0] + ':</b> ' + E(e.q) + (e.at ? ' · اٹکن ' + N(e.at) : '') + (e.m ? ' · غلطی ' + N(e.m) : '') + (e.p ? ' · ' + E(e.p) : '') + (e.l ? ' · سنا: ' + E(e.l) : '') + '</div>'; }).join('') : '<div class="e" style="color:#94a3b8">سبق / سبقی / منزل درج نہیں</div>') + (x.w ? '<div class="e" style="color:#b91c1c">وجہ: ' + E(x.w) + '</div>' : '') + '</div>';
    }).join('') || 'ابھی ریکارڈ نہیں') + '<div style="font-size:12px;color:#94a3b8">ح = حاضر · ½ = آدھی · غ = غیر حاضر (ہر خانہ ایک نشست)</div></div></details>';
    H += '<div class="sh"><button id="pr">📄 PDF / پرنٹ</button><button id="out">🔒 اس فون سے ہٹائیں</button></div><div class="ft">آخری تازگی: ' + (ts ? N(new Date(ts).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })) : '') + ' · یہ رپورٹ صرف آپ کے بچے کی ہے</div></div>';
    app.innerHTML = H;
    document.getElementById('pr').onclick = function(){ document.querySelectorAll('details').forEach(function(x){ x.open = true; }); setTimeout(function(){ window.print(); }, 200); };
    document.getElementById('out').onclick = function(){ try{ localStorage.removeItem(K); }catch(e){} ask(''); };
  }
  var saved = ''; try{ saved = localStorage.getItem(K) || ''; }catch(e){}
  if(saved) load(saved, true); else ask('');
})();
</script>
</body>
</html>
