<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>حفظ پروگریس رپورٹ</title>
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حفظ رپورٹ">
<meta name="theme-color" content="#0B6E4F">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald-950:#08352A;
    --emerald-800:#0B6E4F;
    --emerald-700:#12805C;
    --emerald-100:#E4F3EC;
    --gold-600:#C9A227;
    --gold-400:#E6C55A;
    --maroon:#8C2F39;
    --parchment:#FBF6EC;
    --parchment-2:#F3ECDA;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --line:#E4D9BE;
    --up:#1E7D46;
    --down:#B23A3A;
    --radius:14px;
    --shadow:0 8px 22px -12px rgba(11,110,79,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--parchment);
    font-family:'Noto Naskh Arabic', Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:12px 10px 40px;
    font-size:14.5px;
  }
  .app{max-width:760px;margin:0 auto}

  .header{
    text-align:center;padding:16px 14px 14px;
    background:linear-gradient(160deg,var(--emerald-800),var(--emerald-950));
    border-radius:16px;color:#fff;box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .header .kicker{font-size:11px;letter-spacing:.1em;color:var(--gold-400);text-transform:uppercase;margin-bottom:3px}
  .header .version-tag{
    display:inline-block;
    margin-top:8px;padding:4px 14px;
    font-size:11px;font-weight:700;letter-spacing:.05em;
    border-radius:20px;color:#2B1D02;
    background:#E6C55A;
  }
  .header h1{font-size:21px;margin:0 0 2px;font-weight:700}
  .header .sub{font-size:12.5px;color:#DCEFE6}

  .student-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .chip{padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13.5px;color:var(--ink)}
  .chip.active{background:var(--emerald-800);border-color:var(--emerald-800);color:#fff}
  .chip.add{border-style:dashed;color:var(--emerald-800);font-weight:700;font-size:13px}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px;margin-bottom:12px;box-shadow:0 3px 14px -10px rgba(43,38,32,.18)}
  .card h2{font-size:16.5px;margin:0 0 3px;color:var(--emerald-950)}
  .card .hint{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px}

  .qtable{width:100%;border-collapse:separate;border-spacing:0;margin-top:4px;font-size:12.5px}
  .qtable th{padding:6px 4px;text-align:center;background:var(--emerald-100);color:var(--emerald-950);font-weight:700;font-size:11.5px}
  .qtable th:first-child{border-radius:9px 0 0 0;text-align:right;padding-inline-start:8px}
  .qtable th:last-child{border-radius:0 9px 0 0}
  .qtable td{padding:8px 4px;text-align:center;font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
  .qtable td:first-child{text-align:right;padding-inline-start:8px;font-weight:400;color:var(--ink-soft);font-size:12.5px}
  .qtable tr.row-done td{color:var(--emerald-800)}
  .qtable tr.row-left td{color:var(--maroon);background:#FDF4EC}
  .qtable tr.row-left td:first-child{border-radius:0 0 0 9px}
  .qtable tr:last-child td:first-child{border-radius:0 0 0 9px}

  .builtin-note{font-size:11px;color:var(--ink-soft);margin-top:6px}

  .quran-eta{
    margin-top:12px;position:relative;overflow:hidden;text-align:center;
    padding:10px 12px;border-radius:14px;
    background:linear-gradient(90deg,#0F6B4A,#C9A227,#FFF3B0,#7CFFCB,#C9A227,#0F6B4A);
    background-size:300% 100%;
    animation:vtagShift 3.2s linear infinite, vtagGlow 1.6s ease-in-out infinite alternate;
    box-shadow:0 0 0 1px rgba(201,162,39,.35);
  }
  .quran-eta::before{
    content:"";position:absolute;top:0;left:-160%;width:55%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.95),transparent);
    animation:vtagSweep 2.1s ease-in-out infinite;
  }
  @keyframes vtagShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  @keyframes vtagGlow{
    from{box-shadow:0 0 6px rgba(230,197,90,.55),0 0 12px rgba(230,197,90,.3)}
    to{box-shadow:0 0 16px rgba(255,243,176,.95),0 0 30px rgba(124,255,203,.55)}
  }
  @keyframes vtagSweep{0%{left:-160%}100%{left:170%}}
  .quran-eta .eta-label{position:relative;font-size:13px;font-weight:700;color:#1F1400;opacity:.85;letter-spacing:.03em;margin-bottom:4px}
  .quran-eta .eta-value{position:relative;font-size:23px;font-weight:800;color:#1F1400;letter-spacing:.01em;line-height:1.3}

  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .date-row{margin-bottom:10px}
  .date-row input[type=date]{max-width:220px}
  label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:2px}
  input[type=number],input[type=date],input[type=text]{width:100%;padding:7px 6px;border-radius:9px;border:1.5px solid var(--line);font-family:inherit;font-size:13.5px;background:#FFFEFB}
  input[type=date]{direction:ltr;text-align:right;padding-inline-end:10px;font-size:14px}
  input[type=date]::-webkit-calendar-picker-indicator{padding:0;margin-inline-start:8px;width:16px;height:16px}
  input:focus{outline:2px solid var(--emerald-700);outline-offset:1px}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn-primary{background:linear-gradient(160deg,var(--emerald-700),var(--emerald-800));color:#fff;box-shadow:0 6px 14px -8px rgba(11,110,79,.55)}
  .btn-ghost{background:#fff;color:var(--emerald-800);border:1.5px solid var(--emerald-800)}
  .btn-mini{background:#fff;color:var(--emerald-800);border:1.5px solid var(--emerald-700);padding:4px 8px;font-size:10.5px;border-radius:7px;font-family:inherit;font-weight:700;cursor:pointer}
  .btn-mini.btn-danger{color:var(--down);border-color:var(--down)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .cat-section{margin-bottom:10px}
  .cat-box{border:1.5px solid var(--line);border-radius:12px;padding:10px 10px 8px;margin-bottom:8px;background:var(--parchment-2)}
  .cat-box.sabaq{border-color:var(--emerald-700);background:var(--emerald-100)}
  .cat-box .cat-title{font-size:14px;font-weight:700;color:var(--emerald-950);margin-bottom:6px}
  .cat-box .cat-title small{font-weight:400;color:var(--ink-soft);font-size:11px}

  .settings-toggle{font-size:11.5px;color:var(--emerald-800);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--emerald-950);color:#fff;padding:9px 20px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .loading{text-align:center;padding:40px 8px;color:var(--ink-soft)}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .month-nav .m-btn{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:5px 11px;font-family:inherit;font-size:15px;cursor:pointer;color:var(--emerald-800);font-weight:700}
  .month-nav .m-label{font-size:14px;font-weight:700;color:var(--emerald-950)}

  table.month{width:100%;border-collapse:collapse;font-size:11.5px}
  table.month th,table.month td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
  table.month th{color:var(--ink-soft);font-weight:700;font-size:10.5px;background:var(--parchment-2)}
  table.month td.d-date{color:var(--ink-soft);font-size:10.5px;white-space:nowrap}
  table.month td.naagha{color:var(--down);font-weight:700}
  table.month tr.is-today{background:#FDF6E3}
  table.month tfoot td{font-weight:700;background:var(--emerald-100);color:var(--emerald-950);border-bottom:none}
  table.month tfoot td.naagha-total{color:var(--down)}
  .table-scroll{overflow-x:auto}
  .empty{text-align:center;padding:14px 8px;color:var(--ink-soft);font-size:12.5px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="kicker">Hifz Progress Report</div>
    <h1>حفظ پروگریس رپورٹ</h1>
    <div class="sub">روزانہ سبق، سبقی، منزل اور مکمل قرآنِ پاک کی متوقع تاریخ</div>
    <div class="version-tag">Hpr188tu0300pm</div>
  </div>
  <div id="root"><div class="loading">لوڈ ہو رہا ہے…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- constants ---------------- */
const LINES_PER_PAGE = 16;
const TOTAL_PAGES = 547; /* 16 سطری حفظی مصحف */
const DEFAULT_TOTAL = {para:30, ruku:540, lines:LINES_PER_PAGE*TOTAL_PAGES};
const UNITS = [
  {key:'para',  label:'پارے'},
  {key:'ruku',  label:'رکوع'},
  {key:'lines', label:'لائنیں'},
];
const CATS = [
  {key:'sabaq',  label:'سبق',  hint:'آج کا نیا سبق'},
  {key:'sabqi',  label:'سبقی', hint:'حالیہ سبقوں کا اعادہ'},
  {key:'manzil', label:'منزل', hint:'پرانی منزل کا اعادہ'},
];
const URDU_MONTHS = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const URDU_WEEKDAYS = ['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];

/* ---------------- state ---------------- */
let state = {
  students: [], activeId: null, student: null,
  view: 'main', /* 'main' | 'settings' */
  editDate: null,
  monthCursor: null, /* {y,m} 0-indexed month */
};

/* ---------------- storage helpers (localStorage) ---------------- */
const LS_PREFIX = 'hifz_progress_report:';
async function getJSON(key){
  try{
    const raw = window.localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('storage read error',e); return null; }
}
async function setJSON(key,val){
  try{
    window.localStorage.setItem(LS_PREFIX+key, JSON.stringify(val));
    return true;
  }catch(e){ console.error('storage write error',e); toast('محفوظ نہیں ہو سکا — سٹوریج بھری ہو سکتی ہے'); return false; }
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------------- date helpers ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function iso(d){ return d.toISOString? d.toISOString().slice(0,10): d; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function fmtDate(s){
  const d=parseISO(s);
  return String(d.getDate()).padStart(2,'0')+' '+URDU_MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function pad2(n){ return String(n).padStart(2,'0'); }
function isoOf(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }

/* ---------------- boot ---------------- */
async function boot(){
  const students = await getJSON('students') || [];
  state.students = students;
  const active = await getJSON('active-student');
  if(active && students.find(s=>s.id===active)) state.activeId = active;
  else if(students.length) state.activeId = students[0].id;
  if(state.activeId) state.student = await getJSON('student:'+state.activeId);
  normalizeStudent();
  const now=new Date();
  state.monthCursor = {y:now.getFullYear(), m:now.getMonth()};
  render();
}

function emptyCat(){ return {para:0,ruku:0,lines:0}; }

function normalizeStudent(){
  if(!state.student) return;
  const st=state.student;
  if(!st.total) st.total = {...DEFAULT_TOTAL};
  else st.total = {para: st.total.para||DEFAULT_TOTAL.para, ruku: st.total.ruku||DEFAULT_TOTAL.ruku, lines: st.total.lines||DEFAULT_TOTAL.lines};
  if(!st.baseline) st.baseline = emptyCat();
  if(typeof st.baselineSet !== 'boolean') st.baselineSet = !!(st.baseline.para||st.baseline.ruku||st.baseline.lines);
  if(!st.records) st.records=[];
  /* migrate legacy flat records (para/ruku/lines directly on record) into sabaq */
  st.records = st.records.map(r=>{
    if(r.sabaq || r.sabqi || r.manzil){
      return {date:r.date, note:r.note||'', sabaq:{...emptyCat(),...(r.sabaq||{})}, sabqi:{...emptyCat(),...(r.sabqi||{})}, manzil:{...emptyCat(),...(r.manzil||{})}};
    }
    return {date:r.date, note:r.note||'', sabaq:{para:r.para||0, ruku:r.ruku||0, lines:r.lines||0}, sabqi:emptyCat(), manzil:emptyCat()};
  });
}

async function saveStudentsList(){ await setJSON('students', state.students); }
async function saveActiveId(){ await setJSON('active-student', state.activeId); }
async function saveStudent(){ if(state.student) await setJSON('student:'+state.activeId, state.student); }

/* ---------------- student management ---------------- */
async function addStudent(){
  const name = prompt('طالب علم کا نام درج کریں:');
  if(!name || !name.trim()) return;
  const id = 's_' + Date.now();
  state.students.push({id, name:name.trim()});
  await saveStudentsList();
  state.activeId = id;
  await saveActiveId();
  state.student = { name:name.trim(), total:{...DEFAULT_TOTAL}, baseline:emptyCat(), baselineSet:false, records:[] };
  await saveStudent();
  state.view = 'settings';
  toast('نیا طالب علم شامل ہو گیا');
  render();
}
async function switchStudent(id){
  state.activeId = id;
  await saveActiveId();
  state.student = await getJSON('student:'+id);
  normalizeStudent();
  state.view = 'main';
  state.editDate = null;
  render();
}

/* ---------------- settings page (مکمل قرآن پاک + پہلے سے مکمل مقدار) ---------------- */
function openSettings(){ state.view='settings'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function closeSettings(){ state.view='main'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
async function saveBaseline(){
  const b={};
  UNITS.forEach(u=>{
    const el=document.getElementById('base_'+u.key);
    b[u.key]=Math.max(0, parseInt(el.value||'0',10));
  });
  state.student.baseline=b;
  state.student.baselineSet=true;
  state.view='main';
  await saveStudent();
  toast('پہلے سے مکمل مقدار محفوظ ہو گئی');
  render();
}

/* ---------------- daily entry (سبق / سبقی / منزل) ---------------- */
function readCatInputs(catKey){
  const v={};
  UNITS.forEach(u=>{
    const el=document.getElementById('e_'+catKey+'_'+u.key);
    v[u.key]= el? Math.max(0, parseInt(el.value||'0',10)) : 0;
  });
  return v;
}
async function addEntry(){
  const dateEl=document.getElementById('entry_date');
  const noteEl=document.getElementById('entry_note');
  const date = dateEl.value || todayISO();
  const note = noteEl.value.trim();
  const vals={sabaq:readCatInputs('sabaq'), sabqi:readCatInputs('sabqi'), manzil:readCatInputs('manzil')};
  const any = CATS.some(c=>UNITS.some(u=>vals[c.key][u.key]>0));
  if(!any){ toast('کم از کم ایک خانے میں مقدار درج کریں'); return; }

  if(state.editDate!=null){
    const idx=state.student.records.findIndex(r=>r.date===state.editDate);
    const rec={date, note, sabaq:vals.sabaq, sabqi:vals.sabqi, manzil:vals.manzil};
    if(idx>=0) state.student.records[idx]=rec; else state.student.records.push(rec);
    state.editDate=null;
    state.student.records.sort((a,b)=>a.date.localeCompare(b.date));
    await saveStudent();
    toast('اندراج اپڈیٹ ہو گیا');
    render();
    return;
  }

  const existingIdx = state.student.records.findIndex(r=>r.date===date);
  if(existingIdx>=0){
    const rec=state.student.records[existingIdx];
    CATS.forEach(c=>UNITS.forEach(u=>{ rec[c.key][u.key]=(rec[c.key][u.key]||0)+vals[c.key][u.key]; }));
    if(note) rec.note = rec.note? (rec.note+' — '+note) : note;
    await saveStudent();
    toast('آج کے ریکارڈ میں مقدار شامل کر دی گئی');
    render();
    return;
  }

  const rec={date, note, sabaq:vals.sabaq, sabqi:vals.sabqi, manzil:vals.manzil};
  state.student.records.push(rec);
  state.student.records.sort((a,b)=>a.date.localeCompare(b.date));
  await saveStudent();
  toast('آج کا ریکارڈ محفوظ ہو گیا');
  render();
}
function editEntry(date){
  state.editDate=date;
  render();
  const card=document.getElementById('entry-form-card');
  if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
}
function cancelEdit(){ state.editDate=null; render(); }
async function deleteEntry(date){
  if(!confirm('کیا اس تاریخ کا اندراج حذف کرنا ہے؟')) return;
  state.student.records = state.student.records.filter(r=>r.date!==date);
  if(state.editDate===date) state.editDate=null;
  await saveStudent();
  toast('اندراج حذف ہو گیا');
  render();
}

/* ---------------- derived stats (based on سبق + baseline only) ---------------- */
function completedSabaq(records){
  const c=emptyCat();
  records.forEach(r=>UNITS.forEach(u=>c[u.key]+=(r.sabaq?.[u.key]||0)));
  return c;
}
function combineWithBaseline(compl, baseline){
  const c={}; UNITS.forEach(u=>c[u.key]=(compl[u.key]||0)+((baseline||{})[u.key]||0));
  return c;
}
function remainingTotals(total, completed){
  const rm={}; UNITS.forEach(u=>rm[u.key]=Math.max(0,(total[u.key]||0)-(completed[u.key]||0)));
  return rm;
}
function averagePaceSabaq(records,key){
  const active=records.filter(r=>(r.sabaq?.[key]||0)>0);
  if(!active.length) return 0;
  return active.reduce((a,r)=>a+(r.sabaq[key]||0),0)/active.length;
}
function estimateDays(remaining,pace){ if(!pace||pace<=0) return null; return Math.ceil(remaining/pace); }
function daysToMonths(days){
  if(days==null) return 'ریکارڈ درکار ہے';
  const m=Math.floor(days/30), d=days%30;
  let out=''; if(m>0) out+=m+' مہینے '; out+=d+' دن';
  return out.trim();
}
function completionDateStr(days){
  if(days==null) return null;
  const d=addDays(new Date(),days);
  const dateStr=String(d.getDate()).padStart(2,'0')+' '+URDU_MONTHS[d.getMonth()]+' '+d.getFullYear();
  return URDU_WEEKDAYS[d.getDay()]+'، '+dateStr;
}
function overallEta(records,remaining){
  const order=['lines','para','ruku'];
  for(const key of order){
    const rem=remaining[key]||0;
    if(rem<=0) continue;
    const pace=averagePaceSabaq(records,key);
    const days=estimateDays(rem,pace);
    const cdate=completionDateStr(days);
    if(cdate) return cdate;
  }
  return null;
}

/* ---------------- monthly record ---------------- */
function shiftMonth(delta){
  let {y,m}=state.monthCursor;
  m+=delta;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  state.monthCursor={y,m};
  render();
}
function catCellText(cat){
  const parts=[];
  UNITS.forEach(u=>{ if(cat && cat[u.key]>0) parts.push(cat[u.key]+' '+u.label); });
  return parts.length? parts.join('، ') : null;
}

/* ---------------- render ---------------- */
function render(){
  const root=document.getElementById('root');
  if(!state.students.length){
    root.innerHTML=`
      <div class="card" style="text-align:center">
        <h2>خوش آمدید</h2>
        <p class="hint">شروع کرنے کے لیے پہلا طالب علم شامل کریں</p>
        <button class="btn btn-primary" onclick="addStudent()">+ نیا طالب علم شامل کریں</button>
      </div>`;
    return;
  }
  let html='';
  html+=`<div class="student-bar">`;
  state.students.forEach(s=>{
    html+=`<button class="chip ${s.id===state.activeId?'active':''}" onclick="switchStudent('${s.id}')">${escapeHtml(s.name)}</button>`;
  });
  html+=`<button class="chip add" onclick="addStudent()">+ نیا طالب علم</button>`;
  html+=`</div>`;

  if(!state.student){ root.innerHTML=html+`<div class="loading">لوڈ ہو رہا ہے…</div>`; return; }

  const st=state.student;
  const total=st.total;
  const completed=combineWithBaseline(completedSabaq(st.records), st.baseline);
  const remaining=remainingTotals(total,completed);

  /* ================= SETTINGS PAGE (مکمل قرآنِ پاک + پہلے سے مکمل مقدار) ================= */
  if(state.view==='settings'){
    html+=`<div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">مکمل قرآنِ پاک — سولہ سطری حفظی مصحف</h2>
        <button class="btn-mini" onclick="closeSettings()">‹ واپس</button>
      </div>
      <table class="qtable">
        <thead><tr><th></th>${UNITS.map(u=>`<th>${u.label}</th>`).join('')}</tr></thead>
        <tbody><tr><td>کل قرآن</td>${UNITS.map(u=>`<td>${total[u.key]}</td>`).join('')}</tr></tbody>
      </table>
      <p class="builtin-note">یہ تعداد سولہ سطری حفظی مصحف کے مطابق خودکار طے شدہ ہے — ${LINES_PER_PAGE} × ${TOTAL_PAGES} صفحات = ${DEFAULT_TOTAL.lines} لائنیں</p>
      <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)">
        <h2 style="font-size:14px">پہلے سے مکمل مقدار (اختیاری)</h2>
        <p class="hint">اگر طالب علم پہلے سے کچھ حفظ کر چکا ہے تو یہاں ایک دفعہ درج کریں</p>
        <div class="form-grid">
          ${UNITS.map(u=>`<div><label>${u.label}</label><input type="number" min="0" id="base_${u.key}" value="${st.baseline[u.key]||''}"></div>`).join('')}
        </div>
        <button class="btn btn-primary" onclick="saveBaseline()">محفوظ کریں</button>
        <button class="btn btn-ghost" onclick="closeSettings()" style="margin-inline-start:8px">منسوخ</button>
      </div>
    </div>`;
    root.innerHTML=html;
    return;
  }

  /* ================= MAIN PAGE ================= */
  html+=`<div class="row" style="justify-content:flex-end;margin-bottom:10px">
    <button class="settings-toggle" onclick="openSettings()">⚙ مکمل قرآن / پہلے سے مکمل مقدار</button>
  </div>`;

  /* ---- روزانہ اندراج: سبق / سبقی / منزل (سب سے اوپر) ---- */
  const editRec = state.editDate!=null ? st.records.find(r=>r.date===state.editDate) : null;
  html+=`<div class="card" id="entry-form-card">
    <h2>${editRec? 'اندراج میں ترمیم کریں':'آج کا ریکارڈ درج کریں'}</h2>
    <p class="hint">${editRec? 'مقداریں درست کریں اور اپڈیٹ کر دیں':'جتنی اکائیاں لاگو ہوں وہ بھریں — باقی خالی چھوڑ دیں'}</p>
    <div class="date-row">
      <label>تاریخ</label><input type="date" id="entry_date" value="${editRec? editRec.date : todayISO()}">
    </div>`;
  CATS.forEach(c=>{
    const cv = editRec? editRec[c.key] : emptyCat();
    html+=`<div class="cat-box ${c.key}">
      <div class="cat-title">${c.label} <small>${c.hint}</small></div>
      <div class="form-grid">
        ${UNITS.map(u=>`<div><label>${u.label}</label><input type="number" min="0" id="e_${c.key}_${u.key}" placeholder="0" value="${cv[u.key]||''}"></div>`).join('')}
      </div>
    </div>`;
  });
  html+=`<div style="margin-bottom:8px">
      <label>نوٹ (اختیاری)</label>
      <input type="text" id="entry_note" placeholder="مثلاً: سورۃ البقرہ کی ابتدا" value="${editRec? escapeHtml(editRec.note||''):''}">
    </div>
    <button class="btn btn-primary" onclick="addEntry()">${editRec? 'اپڈیٹ کریں':'محفوظ کریں'}</button>
    ${editRec? `<button class="btn btn-ghost" onclick="cancelEdit()" style="margin-inline-start:8px">منسوخ</button>`:''}
  </div>`;

  /* ---- پیش رفت (سبق کی بنیاد پر) + تخمینہ ختم قرآن — روزانہ اندراج کے نیچے ---- */
  html+=`<div class="card">
    <h2>پیش رفت (سبق کی بنیاد پر)</h2>
    <table class="qtable">
      <thead><tr><th></th>${UNITS.map(u=>`<th>${u.label}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>کل قرآن</td>${UNITS.map(u=>`<td>${total[u.key]||0}</td>`).join('')}</tr>
        <tr class="row-done"><td>مکمل</td>${UNITS.map(u=>`<td>${completed[u.key]||0}</td>`).join('')}</tr>
        <tr class="row-left"><td>باقی</td>${UNITS.map(u=>`<td>${remaining[u.key]||0}</td>`).join('')}</tr>
      </tbody>
    </table>
    ${(()=>{ const eta=overallEta(st.records, remaining); const hasRemaining=UNITS.some(u=>(remaining[u.key]||0)>0); if(!hasRemaining) return '<div class="quran-eta"><div class="eta-label">تخمینہ ختم قرآن</div><div class="eta-value">مبارک ہو، قرآن مکمل! 🎉</div></div>'; return `<div class="quran-eta"><div class="eta-label">تخمینہ ختم قرآن</div><div class="eta-value">${eta || 'روزانہ سبق درج کرنا شروع کریں'}</div></div>`; })()}
  </div>`;

  /* ---- ماہانہ ریکارڈ ---- */
  const {y,m}=state.monthCursor;
  const dim=daysInMonth(y,m);
  const now=new Date();
  const isCurrentMonth = (y===now.getFullYear() && m===now.getMonth());
  const lastDay = isCurrentMonth? now.getDate() : dim;
  const recMap={}; st.records.forEach(r=>{ recMap[r.date]=r; });

  let rowsHtml='';
  const totals={sabaq:0,sabqi:0,manzil:0};
  const naagha={sabaq:0,sabqi:0,manzil:0};
  for(let d=1; d<=lastDay; d++){
    const dateStr=isoOf(y,m,d);
    const rec=recMap[dateStr];
    const isToday = dateStr===todayISO();
    rowsHtml+=`<tr class="${isToday?'is-today':''}">
      <td class="d-date">${pad2(d)} ${URDU_MONTHS[m]}</td>`;
    CATS.forEach(c=>{
      const text = rec? catCellText(rec[c.key]) : null;
      if(text){ totals[c.key]++; rowsHtml+=`<td>${text}</td>`; }
      else{ naagha[c.key]++; rowsHtml+=`<td class="naagha">ناغہ</td>`; }
    });
    rowsHtml+=`<td><button class="btn-mini" onclick="editEntry('${dateStr}')">ترمیم</button> ${rec? `<button class="btn-mini btn-danger" onclick="deleteEntry('${dateStr}')">حذف</button>`:''}</td></tr>`;
  }

  html+=`<div class="card">
    <div class="month-nav">
      <button class="m-btn" onclick="shiftMonth(-1)">›</button>
      <span class="m-label">${URDU_MONTHS[m]} ${y}</span>
      <button class="m-btn" onclick="shiftMonth(1)">‹</button>
    </div>
    <div class="table-scroll">
    <table class="month">
      <thead><tr><th>تاریخ</th>${CATS.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rowsHtml || `<tr><td colspan="5" class="empty">اس مہینے کا کوئی دن نہیں</td></tr>`}</tbody>
      <tfoot>
        <tr>
          <td>سنائی (کل ${lastDay} دن)</td>
          ${CATS.map(c=>`<td>${totals[c.key]}</td>`).join('')}
          <td></td>
        </tr>
        <tr>
          <td>ناغہ</td>
          ${CATS.map(c=>`<td class="naagha-total">${naagha[c.key]}</td>`).join('')}
          <td></td>
        </tr>
      </tfoot>
    </table>
    </div>
  </div>`;

  root.innerHTML=html;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW register failed', e));
  });
}

boot();
</script>
</body>
</html>
