<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>حفظ پروگریس رپورٹ</title>
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حفظ رپورٹ">
<meta name="theme-color" content="#0B6E4F">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --emerald-950:#08352A;
    --emerald-800:#0B6E4F;
    --emerald-700:#12805C;
    --emerald-100:#E4F3EC;
    --gold-600:#C9A227;
    --gold-400:#E6C55A;
    --maroon:#8C2F39;
    --parchment:#FBF6EC;
    --parchment-2:#F3ECDA;
    --ink:#2B2620;
    --ink-soft:#6B6255;
    --line:#E4D9BE;
    --up:#1E7D46;
    --down:#B23A3A;
    --radius:14px;
    --shadow:0 8px 22px -12px rgba(11,110,79,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--parchment);
    font-family:'Noto Naskh Arabic', Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:12px 10px 40px;
    font-size:14.5px;
  }
  .app{max-width:760px;margin:0 auto}

  .header{
    text-align:center;padding:16px 14px 14px;
    background:linear-gradient(160deg,var(--emerald-800),var(--emerald-950));
    border-radius:16px;color:#fff;box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .header .kicker{font-size:11px;letter-spacing:.1em;color:var(--gold-400);text-transform:uppercase;margin-bottom:3px}
  .header .version-tag{margin-top:7px;font-size:10.5px;color:var(--gold-400);opacity:.85;letter-spacing:.03em}
  .header h1{font-size:21px;margin:0 0 2px;font-weight:700}
  .header .sub{font-size:12.5px;color:#DCEFE6}

  .student-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .chip{padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13.5px;color:var(--ink)}
  .chip.active{background:var(--emerald-800);border-color:var(--emerald-800);color:#fff}
  .chip.add{border-style:dashed;color:var(--emerald-800);font-weight:700;font-size:13px}

  .tab-bar{display:flex;gap:6px;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
  .tab-btn{flex:1;text-align:center;padding:9px 6px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft)}
  .tab-btn.active{background:var(--emerald-800);color:#fff}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px;margin-bottom:12px;box-shadow:0 3px 14px -10px rgba(43,38,32,.18)}
  .card h2{font-size:16.5px;margin:0 0 3px;color:var(--emerald-950)}
  .card .hint{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px}

  .qtable{width:100%;border-collapse:separate;border-spacing:0;margin-top:4px;font-size:12.5px}
  .qtable th{padding:6px 4px;text-align:center;background:var(--emerald-100);color:var(--emerald-950);font-weight:700;font-size:11.5px}
  .qtable th:first-child{border-radius:9px 0 0 0;text-align:right;padding-inline-start:8px}
  .qtable th:last-child{border-radius:0 9px 0 0}
  .qtable td{padding:8px 4px;text-align:center;font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
  .qtable td:first-child{text-align:right;padding-inline-start:8px;font-weight:400;color:var(--ink-soft);font-size:12.5px}
  .qtable tr.row-done td{color:var(--emerald-800)}
  .qtable tr.row-left td{color:var(--maroon);background:#FDF4EC}
  .qtable tr.row-left td:first-child{border-radius:0 0 0 9px}

  .unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
  .unit-card{border-radius:12px;padding:10px 10px 9px;background:linear-gradient(165deg,var(--emerald-100),#fff);border:1px solid #D7ECE1}
  .unit-card .u-name{font-size:13.5px;color:var(--emerald-950);font-weight:700;margin-bottom:2px}
  .unit-card .u-remain{font-size:22px;font-weight:800;color:var(--emerald-800);line-height:1.1}
  .unit-card .u-remain small{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
  .unit-card .u-est{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink)}
  .unit-card .u-est b{color:var(--maroon)}
  .unit-card .u-date{margin-top:5px;font-size:11.5px;background:#fff;border:1px dashed var(--gold-600);border-radius:8px;padding:5px 7px;color:var(--emerald-950)}
  .whatif{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;flex-wrap:wrap}
  .whatif input{width:46px;padding:4px 5px;border-radius:7px;border:1px solid var(--line);font-family:inherit;font-size:12px;text-align:center}
  .whatif .out{font-weight:700;color:var(--emerald-800)}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:8px}
  .date-row{margin-bottom:8px}
  .date-row input[type=date]{max-width:220px}
  label{font-size:11.5px;color:var(--ink-soft);display:block;margin-bottom:3px}
  input[type=number],input[type=date],input[type=text]{width:100%;padding:8px 8px;border-radius:9px;border:1.5px solid var(--line);font-family:inherit;font-size:13.5px;background:#FFFEFB}
  input[type=date]{direction:ltr;text-align:right;padding-inline-end:10px;font-size:14px}
  input[type=date]::-webkit-calendar-picker-indicator{padding:0;margin-inline-start:8px;width:16px;height:16px}
  input:focus{outline:2px solid var(--emerald-700);outline-offset:1px}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn-primary{background:linear-gradient(160deg,var(--emerald-700),var(--emerald-800));color:#fff;box-shadow:0 6px 14px -8px rgba(11,110,79,.55)}
  .btn-ghost{background:#fff;color:var(--emerald-800);border:1.5px solid var(--emerald-800)}
  .btn-danger{background:#fff;color:var(--down);border:1.5px solid var(--down);padding:5px 9px;font-size:11.5px;border-radius:7px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .compare-line{display:flex;gap:14px;flex-wrap:wrap;background:var(--parchment-2);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px}
  .compare-line b{color:var(--emerald-950);font-size:13.5px}

  .mini-log{width:100%;border-collapse:collapse;font-size:12px}
  .mini-log th,.mini-log td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
  .mini-log th{color:var(--ink-soft);font-size:10.5px;background:var(--parchment-2)}

  .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filter-btn{padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
  .filter-btn.active{background:var(--emerald-950);color:#fff;border-color:var(--emerald-950)}
  .unit-select{margin-inline-start:auto;padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);font-family:inherit;font-size:12.5px;background:#fff}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
  .stat-card{background:var(--parchment-2);border-radius:11px;padding:9px 10px;text-align:center}
  .stat-card .val{font-size:19px;font-weight:800;color:var(--emerald-950)}
  .stat-card .lab{font-size:10.5px;color:var(--ink-soft);margin-top:2px}
  .trend-up{color:var(--up)} .trend-down{color:var(--down)}

  .chart-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px;height:200px}

  table.log{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  table.log th,table.log td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
  table.log th{color:var(--ink-soft);font-weight:700;font-size:10.5px;background:var(--parchment-2)}
  table.log tbody tr:hover{background:#FAF6EA}
  .empty{text-align:center;padding:18px 8px;color:var(--ink-soft);font-size:12.5px}

  .settings-toggle{font-size:11.5px;color:var(--emerald-800);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--emerald-950);color:#fff;padding:9px 20px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .loading{text-align:center;padding:40px 8px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="kicker">Hifz Progress Report</div>
    <h1>حفظ پروگریس رپورٹ</h1>
    <div class="sub">روزانہ سبق، مکمل قرآنِ پاک اور تکمیل کی متوقع تاریخ</div>
    <div class="version-tag">ورژن: Hpr121tu11aug1054am — 11 اگست 2026</div>
  </div>
  <div id="root"><div class="loading">لوڈ ہو رہا ہے…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- constants ---------------- */
const LINES_PER_PAGE = 16;
const UNITS = [
  {key:'para',  label:'پارے',   icon:'📿'},
  {key:'pao',   label:'پاؤ',    icon:'🕋'},
  {key:'ruku',  label:'رکوع',   icon:'🕌'},
  {key:'safha', label:'صفحات', icon:'📄'},
  {key:'lines', label:'لائنیں', icon:'✒️'},
];
const FILTERS = [
  {key:'today', label:'آج'},
  {key:'week',  label:'اس ہفتے'},
  {key:'month', label:'اس مہینے'},
  {key:'all',   label:'مکمل ریکارڈ'},
];
const URDU_MONTHS = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const DEFAULT_TOTAL = {para:30, pao:120, ruku:540, safha:0, lines:0};
const TABS = [
  {key:'entry', label:'روزانہ اندراج'},
  {key:'estimate', label:'تخمینہ'},
  {key:'report', label:'رپورٹ'},
];

/* ---------------- state ---------------- */
let state = {
  students: [], activeId: null, student: null,
  filter: 'week', unitView: 'lines', showSettings: false, chart: null,
  tab: 'entry',
};

/* ---------------- storage helpers (localStorage — works when file is opened directly in a browser) ---------------- */
const LS_PREFIX = 'hifz_progress_report:';
async function getJSON(key){
  try{
    const raw = window.localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('storage read error',e); return null; }
}
async function setJSON(key,val){
  try{
    window.localStorage.setItem(LS_PREFIX+key, JSON.stringify(val));
    return true;
  }catch(e){ console.error('storage write error',e); toast('محفوظ نہیں ہو سکا — سٹوریج بھری ہو سکتی ہے'); return false; }
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------------- date helpers ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function iso(d){ return d.toISOString? d.toISOString().slice(0,10): d; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function fmtDate(s){
  const d=parseISO(s);
  return String(d.getDate()).padStart(2,'0')+' '+URDU_MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function getRange(filterKey, ref=new Date()){
  if(filterKey==='today'){ const t=iso(ref); return {start:t,end:t}; }
  if(filterKey==='week'){ return {start:iso(addDays(ref,-6)), end:iso(ref)}; }
  if(filterKey==='month'){
    const first=new Date(ref.getFullYear(),ref.getMonth(),1);
    const last=new Date(ref.getFullYear(),ref.getMonth()+1,0);
    return {start:iso(first), end:iso(last)};
  }
  return {start:null,end:null};
}
function getPrevRange(filterKey, curStart){
  if(filterKey==='today'){ const p=addDays(parseISO(curStart),-1); return {start:iso(p),end:iso(p)}; }
  if(filterKey==='week'){ const s=addDays(parseISO(curStart),-7); const e=addDays(parseISO(curStart),-1); return {start:iso(s),end:iso(e)}; }
  if(filterKey==='month'){
    const s=parseISO(curStart);
    const prevLast=new Date(s.getFullYear(),s.getMonth(),0);
    const prevFirst=new Date(prevLast.getFullYear(),prevLast.getMonth(),1);
    return {start:iso(prevFirst), end:iso(prevLast)};
  }
  return {start:null,end:null};
}
function inRange(dateStr,start,end){ if(!start) return true; return dateStr>=start && dateStr<=end; }
function filterRecords(records,filterKey){
  const {start,end}=getRange(filterKey);
  return records.filter(r=>inRange(r.date,start,end)).sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------------- boot ---------------- */
async function boot(){
  const students = await getJSON('students') || [];
  state.students = students;
  const active = await getJSON('active-student');
  if(active && students.find(s=>s.id===active)) state.activeId = active;
  else if(students.length) state.activeId = students[0].id;
  if(state.activeId) state.student = await getJSON('student:'+state.activeId);
  normalizeStudent();
  render();
}
function normalizeStudent(){
  if(!state.student) return;
  if(!state.student.total) state.student.total = {...DEFAULT_TOTAL};
  if(!state.student.records) state.student.records = [];
  if(!state.student.baseline) state.student.baseline = {para:0,pao:0,ruku:0,safha:0,lines:0};
}
function combineWithBaseline(compl, baseline){
  const c={}; UNITS.forEach(u=>c[u.key]=(compl[u.key]||0)+((baseline||{})[u.key]||0));
  return c;
}
async function saveStudentsList(){ await setJSON('students', state.students); }
async function saveActiveId(){ await setJSON('active-student', state.activeId); }
async function saveStudent(){ if(state.student) await setJSON('student:'+state.activeId, state.student); }

/* ---------------- student management ---------------- */
async function addStudent(){
  const name = prompt('طالب علم کا نام درج کریں:');
  if(!name || !name.trim()) return;
  const id = 's_' + Date.now();
  state.students.push({id, name:name.trim()});
  await saveStudentsList();
  state.activeId = id;
  await saveActiveId();
  state.student = { name:name.trim(), total:{...DEFAULT_TOTAL}, records:[], baseline:{para:0,pao:0,ruku:0,safha:0,lines:0} };
  await saveStudent();
  toast('نیا طالب علم شامل ہو گیا');
  render();
}
async function switchStudent(id){
  state.activeId = id;
  await saveActiveId();
  state.student = await getJSON('student:'+id);
  normalizeStudent();
  state.showSettings = false;
  render();
}
function setTab(t){ state.tab=t; render(); }

/* ---------------- settings: total quran ---------------- */
function onParaInput(){
  const para = parseInt(document.getElementById('tot_para').value||'0',10);
  document.getElementById('tot_pao').value = para*4;
}
function onSafhaInput(){
  const safha = parseInt(document.getElementById('tot_safha').value||'0',10);
  document.getElementById('tot_lines').value = safha*LINES_PER_PAGE;
}
function onBaseParaInput(){
  const para = parseInt(document.getElementById('base_para').value||'0',10);
  document.getElementById('base_pao').value = para*4;
}
function onBaseSafhaInput(){
  const safha = parseInt(document.getElementById('base_safha').value||'0',10);
  document.getElementById('base_lines').value = safha*LINES_PER_PAGE;
}
async function saveTotal(){
  const t = {}; const b = {};
  UNITS.forEach(u=>{
    const el = document.getElementById('tot_'+u.key);
    t[u.key] = Math.max(0, parseInt(el.value||'0',10));
    const bel = document.getElementById('base_'+u.key);
    b[u.key] = bel ? Math.max(0, parseInt(bel.value||'0',10)) : 0;
  });
  state.student.total = t;
  state.student.baseline = b;
  state.showSettings = false;
  await saveStudent();
  toast('مکمل قرآنِ پاک کی تفصیل محفوظ ہو گئی');
  render();
}

/* ---------------- daily entry ---------------- */
async function addEntry(){
  const dateEl=document.getElementById('entry_date');
  const noteEl=document.getElementById('entry_note');
  const date = dateEl.value || todayISO();
  const note = noteEl.value.trim();
  const rec = {date, note};
  let any=false;
  UNITS.forEach(u=>{
    const el=document.getElementById('entry_'+u.key);
    const v=Math.max(0, parseInt(el.value||'0',10));
    rec[u.key]=v;
    if(v>0) any=true;
  });
  if(!any){ toast('کم از کم ایک خانے میں مقدار درج کریں'); return; }
  state.student.records.push(rec);
  state.student.records.sort((a,b)=>a.date.localeCompare(b.date));
  await saveStudent();
  toast('آج کا سبق محفوظ ہو گیا');
  render();
}
async function deleteEntry(idx){
  if(!confirm('کیا یہ اندراج حذف کرنا ہے؟')) return;
  state.student.records.splice(idx,1);
  await saveStudent();
  toast('اندراج حذف ہو گیا');
  render();
}

/* ---------------- derived stats ---------------- */
function completedTotals(records){
  const c={}; UNITS.forEach(u=>c[u.key]=0);
  records.forEach(r=>UNITS.forEach(u=>c[u.key]+=(r[u.key]||0)));
  return c;
}
function remainingTotals(total, completed){
  const rm={}; UNITS.forEach(u=>rm[u.key]=Math.max(0,(total[u.key]||0)-(completed[u.key]||0)));
  return rm;
}
function averagePace(records,key){
  const active=records.filter(r=>(r[key]||0)>0);
  if(!active.length) return 0;
  return active.reduce((a,r)=>a+(r[key]||0),0)/active.length;
}
function estimateDays(remaining,pace){ if(pace<=0) return null; return Math.ceil(remaining/pace); }
function daysToMonths(days){
  if(days==null) return 'ریکارڈ درکار ہے';
  const m=Math.floor(days/30), d=days%30;
  let out=''; if(m>0) out+=m+' مہینے '; out+=d+' دن';
  return out.trim();
}
function completionDateStr(days){
  if(days==null) return null;
  const d=addDays(new Date(),days);
  return String(d.getDate()).padStart(2,'0')+' '+URDU_MONTHS[d.getMonth()]+' '+d.getFullYear();
}
function setFilter(key){ state.filter=key; render(); }
function setUnitView(key){ state.unitView=key; render(); }
function toggleSettings(){ state.showSettings=!state.showSettings; render(); }
function labelOf(key){ return UNITS.find(u=>u.key===key).label; }

/* ---------------- render ---------------- */
function render(){
  const root=document.getElementById('root');
  if(!state.students.length){
    root.innerHTML=`
      <div class="card" style="text-align:center">
        <h2>خوش آمدید</h2>
        <p class="hint">شروع کرنے کے لیے پہلا طالب علم شامل کریں</p>
        <button class="btn btn-primary" onclick="addStudent()">+ نیا طالب علم شامل کریں</button>
      </div>`;
    return;
  }
  let html='';
  html+=`<div class="student-bar">`;
  state.students.forEach(s=>{
    html+=`<button class="chip ${s.id===state.activeId?'active':''}" onclick="switchStudent('${s.id}')">${escapeHtml(s.name)}</button>`;
  });
  html+=`<button class="chip add" onclick="addStudent()">+ نیا طالب علم</button>`;
  html+=`</div>`;

  if(!state.student){ root.innerHTML=html+`<div class="loading">لوڈ ہو رہا ہے…</div>`; return; }

  const st=state.student;
  const total=st.total;
  const completed=combineWithBaseline(completedTotals(st.records), st.baseline);
  const remaining=remainingTotals(total,completed);
  const totalSet = UNITS.some(u=>(total[u.key]||0)>0);

  html+=`<div class="tab-bar">${TABS.map(t=>`<button class="tab-btn ${t.key===state.tab?'active':''}" onclick="setTab('${t.key}')">${t.label}</button>`).join('')}</div>`;

  /* settings card (total quran entry) shown whenever incomplete or toggled, regardless of tab */
  if(!totalSet || state.showSettings){
    html+=`<div class="card">
      <h2>مکمل قرآنِ پاک — سولہ سطری حفظی مصحف</h2>
      <p class="hint">اپنے قرآن پاک کے مطابق کل تعداد درج کریں۔ پارے سے پاؤ خودکار بنیں گے، صفحات سے لائنیں خودکار (صفحات × 16) بنیں گی۔ بعد میں تصحیح بھی کر سکتے ہیں۔</p>
      <div class="form-grid">
        <div><label>کل پارے</label><input type="number" min="0" id="tot_para" value="${total.para||30}" oninput="onParaInput()"></div>
        <div><label>کل پاؤ</label><input type="number" min="0" id="tot_pao" value="${total.pao||120}"></div>
        <div><label>کل رکوع</label><input type="number" min="0" id="tot_ruku" value="${total.ruku||540}"></div>
        <div><label>کل صفحات</label><input type="number" min="0" id="tot_safha" value="${total.safha||''}" placeholder="آخری صفحہ نمبر دیکھیں" oninput="onSafhaInput()"></div>
        <div><label>کل لائنیں</label><input type="number" min="0" id="tot_lines" value="${total.lines||''}" placeholder="صفحات × 16"></div>
      </div>
      <h2 style="font-size:14px;margin-top:14px">پہلے سے مکمل مقدار (اختیاری)</h2>
      <p class="hint">اگر طالب علم پہلے سے کچھ حفظ کر چکا ہے تو یہاں درج کریں — یہ خود بخود پیش رفت میں شامل ہو جائے گا</p>
      <div class="form-grid">
        <div><label>مکمل پارے</label><input type="number" min="0" id="base_para" value="${st.baseline?.para||''}" oninput="onBaseParaInput()"></div>
        <div><label>مکمل پاؤ</label><input type="number" min="0" id="base_pao" value="${st.baseline?.pao||''}"></div>
        <div><label>مکمل رکوع</label><input type="number" min="0" id="base_ruku" value="${st.baseline?.ruku||''}"></div>
        <div><label>مکمل صفحات</label><input type="number" min="0" id="base_safha" value="${st.baseline?.safha||''}" placeholder="آخری پڑھا ہوا صفحہ نمبر" oninput="onBaseSafhaInput()"></div>
        <div><label>مکمل لائنیں</label><input type="number" min="0" id="base_lines" value="${st.baseline?.lines||''}" placeholder="صفحات × 16"></div>
      </div>
      <button class="btn btn-primary" onclick="saveTotal()">محفوظ کریں</button>
      ${state.showSettings? `<button class="btn btn-ghost" onclick="toggleSettings()" style="margin-inline-start:8px">منسوخ</button>`:''}
    </div>`;
  }

  if(totalSet){

    if(state.tab==='entry'){
      html+=`<div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>پیش رفت</h2>
          <button class="settings-toggle" onclick="toggleSettings()">ترتیب / تصحیح</button>
        </div>
        <table class="qtable">
          <thead><tr><th></th>${UNITS.map(u=>`<th>${u.label}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td>کل قرآن</td>${UNITS.map(u=>`<td>${total[u.key]||0}</td>`).join('')}</tr>
            <tr class="row-done"><td>مکمل</td>${UNITS.map(u=>`<td>${completed[u.key]||0}</td>`).join('')}</tr>
            <tr class="row-left"><td>باقی</td>${UNITS.map(u=>`<td>${remaining[u.key]||0}</td>`).join('')}</tr>
          </tbody>
        </table>
      </div>`;

      html+=`<div class="card">
        <h2>آج کا سبق درج کریں</h2>
        <p class="hint">جتنی اکائیاں لاگو ہوں وہ بھریں — باقی خالی چھوڑ دیں</p>
        <div class="date-row">
          <label>تاریخ</label><input type="date" id="entry_date" value="${todayISO()}">
        </div>
        <div class="form-grid">
          ${UNITS.map(u=>`<div><label>${u.label}</label><input type="number" min="0" id="entry_${u.key}" placeholder="0"></div>`).join('')}
        </div>
        <div style="margin-bottom:8px">
          <label>نوٹ (اختیاری)</label>
          <input type="text" id="entry_note" placeholder="مثلاً: سورۃ البقرہ کی ابتدا">
        </div>
        <button class="btn btn-primary" onclick="addEntry()">محفوظ کریں</button>
      </div>`;

      const sortedAll = st.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
      html+=`<div class="card">
        <h2>حالیہ اندراجات</h2>
        ${sortedAll.length? `
        <table class="mini-log">
          <thead><tr><th>تاریخ</th>${UNITS.map(u=>`<th>${u.label}</th>`).join('')}</tr></thead>
          <tbody>
            ${sortedAll.map(r=>`<tr><td>${fmtDate(r.date)}</td>${UNITS.map(u=>`<td>${r[u.key]||'-'}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty">ابھی کوئی اندراج نہیں</div>`}
      </div>`;
    }

    if(state.tab==='estimate'){
      html+=`<div class="card">
        <h2>تخمینہ تکمیل</h2>
        <p class="hint">ہر اکائی کی اپنی اوسط رفتار اور متوقع تکمیل کی تاریخ</p>
        <div class="unit-grid">`;
      UNITS.forEach(u=>{
        const rem=remaining[u.key]||0;
        const pace=averagePace(st.records,u.key);
        const days=estimateDays(rem,pace);
        const cdate=completionDateStr(days);
        const whatRate = pace? Math.max(1,Math.round(pace)) : 1;
        const whatDays = estimateDays(rem, whatRate);
        html+=`<div class="unit-card">
          <div class="u-name">${u.label}</div>
          <div class="u-remain">${rem} <small>باقی</small></div>
          <div class="u-est">
            اوسط روزانہ: <b>${pace? pace.toFixed(1): '—'}</b><br>
            تخمینہ وقت: <b>${daysToMonths(days)}</b>
          </div>
          ${cdate? `<div class="u-date">متوقع تکمیل: <b>${cdate}</b></div>`:''}
          <div class="whatif">
            اگر روزانہ
            <input type="number" min="1" value="${whatRate}" oninput="whatIf('${u.key}', this.value, ${rem})">
            ${u.label} سنائیں تو:
          </div>
          <div class="whatif" id="whatif_${u.key}" style="margin-top:2px">
            <span class="out">${daysToMonths(whatDays)}</span>${completionDateStr(whatDays)? ` — <span class="out">${completionDateStr(whatDays)}</span>`:''}
          </div>
        </div>`;
      });
      html+=`</div></div>`;
    }

    if(state.tab==='report'){
      const records=st.records;
      const filtered=filterRecords(records,state.filter);
      const {start}=getRange(state.filter);
      const prev=getPrevRange(state.filter, start || (records[0]?records[0].date:todayISO()));
      const prevFiltered = state.filter==='all' ? [] : records.filter(r=>inRange(r.date,prev.start,prev.end));

      const uv=state.unitView;
      const total_ = filtered.reduce((a,r)=>a+(r[uv]||0),0);
      const prevTotal = prevFiltered.reduce((a,r)=>a+(r[uv]||0),0);
      const activeDays = filtered.filter(r=>(r[uv]||0)>0).length;
      const avg = activeDays? (total_/activeDays):0;
      let best=null;
      filtered.forEach(r=>{ if((r[uv]||0)>0 && (!best||r[uv]>best[uv])) best=r; });
      const diff=total_-prevTotal;
      const trendUp=diff>=0;

      const sortedAll = records.slice().sort((a,b)=>a.date.localeCompare(b.date));
      let compareHtml='';
      if(sortedAll.length){
        const last = sortedAll[sortedAll.length-1];
        const prevOne = sortedAll.length>1 ? sortedAll[sortedAll.length-2] : null;
        compareHtml = `<div class="compare-line">
          ${prevOne? `<span>گزشتہ سبق (${fmtDate(prevOne.date)}): <b>${prevOne[uv]||0}</b> ${labelOf(uv)}</span>`:''}
          <span>تازہ ترین سبق (${fmtDate(last.date)}): <b>${last[uv]||0}</b> ${labelOf(uv)}</span>
        </div>`;
      }

      html+=`<div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="margin:0">ریکارڈ اور تجزیہ</h2>
          <select class="unit-select" onchange="setUnitView(this.value)">
            ${UNITS.map(u=>`<option value="${u.key}" ${u.key===uv?'selected':''}>${u.label}</option>`).join('')}
          </select>
        </div>
        ${compareHtml}
        <div class="filter-bar">
          ${FILTERS.map(f=>`<button class="filter-btn ${f.key===state.filter?'active':''}" onclick="setFilter('${f.key}')">${f.label}</button>`).join('')}
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="val">${total_}</div><div class="lab">کل ${labelOf(uv)}</div></div>
          <div class="stat-card"><div class="val">${avg? avg.toFixed(1):0}</div><div class="lab">یومیہ اوسط</div></div>
          <div class="stat-card"><div class="val">${best? best[uv]:0}</div><div class="lab">بہترین دن${best? ' ('+fmtDate(best.date)+')':''}</div></div>
          <div class="stat-card">
            <div class="val ${state.filter==='all'?'':(trendUp?'trend-up':'trend-down')}">${state.filter==='all'?'—':(trendUp?'▲ ':'▼ ')+Math.abs(diff)}</div>
            <div class="lab">${state.filter==='all'?'رجحان (مکمل ریکارڈ میں لاگو نہیں)':'گزشتہ مدت کے مقابلے میں'}</div>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="hifzChart"></canvas></div>
        <div class="table-wrap">
          ${filtered.length? `
          <table class="log">
            <thead><tr><th>تاریخ</th>${UNITS.map(u=>`<th>${u.label}</th>`).join('')}<th>نوٹ</th><th></th></tr></thead>
            <tbody>
              ${filtered.slice().reverse().map(r=>{
                const realIdx=records.indexOf(r);
                return `<tr>
                  <td>${fmtDate(r.date)}</td>
                  ${UNITS.map(u=>`<td>${r[u.key]||'-'}</td>`).join('')}
                  <td>${r.note? escapeHtml(r.note):'-'}</td>
                  <td><button class="btn-danger" onclick="deleteEntry(${realIdx})">حذف</button></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>` : `<div class="empty">اس مدت میں کوئی ریکارڈ موجود نہیں</div>`}
        </div>
      </div>`;
    }
  }

  root.innerHTML=html;
  if(totalSet && state.tab==='report') drawChart(filterRecords(state.student.records,state.filter));
}

function whatIf(key,val,remaining){
  const rate=Math.max(1,parseInt(val||'1',10));
  const days=estimateDays(remaining,rate);
  const cdate=completionDateStr(days);
  const box=document.getElementById('whatif_'+key);
  if(box) box.innerHTML = `<span class="out">${daysToMonths(days)}</span>${cdate? ` — <span class="out">${cdate}</span>`:''}`;
}

function drawChart(records){
  const ctx=document.getElementById('hifzChart');
  if(!ctx) return;
  const uv=state.unitView;
  const labels=records.map(r=>fmtDate(r.date));
  const data=records.map(r=>r[uv]||0);
  if(state.chart) state.chart.destroy();
  state.chart=new Chart(ctx,{
    type:'bar',
    data:{labels, datasets:[{label:labelOf(uv), data, backgroundColor:'rgba(11,110,79,0.75)', borderRadius:5, maxBarThickness:30}]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true, ticks:{precision:0}}, x:{ticks:{autoSkip:true, maxRotation:0}}}
    }
  });
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW register failed', e));
  });
}

boot();
</script>
</body>
</html>
